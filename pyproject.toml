[project]
name = "cleaning-robot-api"
version = "1.0.0"
description = "REST API to remotely control a household cleaning robot."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.9",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "poethepoet>=0.27",
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.poe.tasks]
run = "uvicorn src.app.main:app --host 0.0.0.0 --port 8000"
dev = "uvicorn src.app.main:app --host 127.0.0.1 --port 8000 --reload"
test = "pytest"
lint = "ruff check ."
format = "ruff format ."

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q -ra --tb=short"
strict_markers = true
strict_config = true
# A broken fixture glob must break the build. By default an empty parametrize
# list is reported as a *skip*, which is exactly the silent-green failure this
# suite is built to avoid.
empty_parameter_set_mark = "fail_at_collect"
filterwarnings = [
    # Starlette 1.6 nudges TestClient users toward httpx2. Not our bug, and
    # pinning httpx2 is out of scope for this assignment.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:UserWarning",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
