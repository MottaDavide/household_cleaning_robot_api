[project]
name = "cleaning-robot-api"
version = "1.0.0"
description = "REST API to remotely control a household cleaning robot."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.9",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "poethepoet>=0.27",
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.poe.tasks]
run = "uvicorn src.app.main:app --host 0.0.0.0 --port 8000"
dev = "uvicorn src.app.main:app --host 127.0.0.1 --port 8000 --reload"
test = "pytest"
lint = "ruff check ."
format = "ruff format ."

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
